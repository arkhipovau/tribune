<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team — Tribune</title>
  <meta name="description" content="A football club imagined by children, and the house they designed for it.">
  <link rel="preload" href="assets/fonts/Youth-Medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../udf/bundles/team.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body class="o-page-team">

{{> s-header}}

<main class="o-team">
  <!-- Stage for the house. Today: render image. Later: a 3D scene mounts here. -->
  <div class="o-team__stage" aria-hidden="true"></div>

  <nav class="m-team-switch" aria-label="Clubs"></nav>

  <aside class="o-team__panel">
    <section class="o-tp-hero">
      <h1 class="a-display o-tp-hero__title"></h1>
      <div class="o-tp-hero__gallery"></div>
      <div class="a-pill o-tp-hero__ticks" role="tablist" aria-label="Team images"></div>
    </section>

    <section class="o-tp-row o-tp-about">
      <span class="o-tp-row__text">
        <span>About</span>
        <span class="a-muted o-tp-about__tagline"></span>
      </span>
      <span class="a-glass o-tp-row__tile o-tp-about__crest"></span>
    </section>

    <section class="o-tp-row o-tp-credits">
      <span class="o-tp-row__text o-tp-credits__text"></span>
      <span class="o-tp-row__tiles o-tp-credits__tiles"></span>
    </section>

    <a class="o-tp-patron" href="mailto:?subject=Become%20a%20Patron">
      <span>Become a Patron</span>
      <span class="o-tp-patron__btn">+ <img class="o-tp-patron__drawing" src="" alt=""></span>
    </a>

  </aside>
</main>

<script type="module" src="../udf/bundles/team.js"></script>
</body>
</html>
