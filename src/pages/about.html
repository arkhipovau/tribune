<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Brand fonts load with the first screen (small Latin subsets, font-display: block). -->
  <link rel="preload" href="assets/fonts/Youth-Medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/SuisseIntl-Book.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/SuisseIntl-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
  <!-- AVIF photos fall back to the WebP copy where AVIF is not supported. -->
  <script>addEventListener("error",function(e){var t=e.target;if(t&&t.tagName==="IMG"&&/\.avif$/.test(t.src)){t.src=t.src.replace(/\.avif$/,".webp")}},true)</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manifesto — Tribune</title>
  <meta name="description" content="The Tribune manifesto as a stadium: rotate, zoom in and read every stand.">
  <link rel="stylesheet" href="../udf/bundles/about.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body class="o-page-about">

{{> s-header}}

<main class="o-arena">
  <canvas class="o-arena__canvas" aria-label="3D stadium made of the Tribune manifesto. Drag to rotate, scroll or pinch to zoom."></canvas>

  <div class="o-arena__loading" role="status">Building the stadium…</div>

  <nav class="o-arena__stands" aria-label="Stands"></nav>


  <button class="a-link-under o-arena__read" type="button" data-opens="manifesto-text" aria-haspopup="dialog">Read as text</button>
</main>

<dialog class="m-sheet" id="manifesto-text" aria-labelledby="manifesto-text-title">
  <article class="m-sheet__card" tabindex="-1" autofocus>
    <span class="m-sheet__handle" aria-hidden="true"></span>
    <div class="m-sheet__top">
      <p class="m-sheet__heading">Manifesto</p>
      <button class="m-expand-btn m-expand-btn--close m-sheet__close" type="button" data-closes>
        <span class="m-expand-btn__label"><span>Close</span></span>
        <span class="m-expand-btn__icon"><svg viewBox="0 0 16 16" width="10" height="10" aria-hidden="true"><rect y="7" width="16" height="2" fill="currentColor"/><rect x="7" width="2" height="16" fill="currentColor"/></svg></span>
      </button>
    </div>
    <h2 class="a-display m-sheet__headline" id="manifesto-text-title">tribune</h2>
    <div class="m-sheet__body o-about-text"></div>
  </article>
</dialog>

<script type="module" src="../udf/bundles/about.js"></script>
</body>
</html>
